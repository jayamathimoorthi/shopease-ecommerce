<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ShopEase - E-Commerce Store</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ================= NAVBAR ================= -->

  <header class="navbar">

    <div class="logo">
      🛍️ ShopEase
    </div>

    <nav>
      <a href="#home">Home</a>

      <a href="#products">Products</a>

      <a href="#cart">
        Cart 🛒
        <span id="cart-count">0</span>
      </a>

      <button id="login-btn">
        Login
      </button>
    </nav>

  </header>


  <!-- ================= MAIN ================= -->

  <main>

    <!-- ================= HERO ================= -->

    <section id="home" class="hero">

      <div>

        <h1>
          Welcome to ShopEase
        </h1>

        <p>
          Discover amazing products at great prices.
        </p>

        <button onclick="scrollToProducts()">
          Shop Now
        </button>

      </div>

    </section>


    <!-- ================= PRODUCTS ================= -->

    <section id="products" class="products-section">

      <h2>
        Our Products
      </h2>


      <!-- CONTROLS -->

      <div class="controls">

        <input
          type="search"
          id="search-input"
          placeholder="Search products..."
        >


        <select id="category-select">

          <option value="all">
            All Categories
          </option>

          <option value="beauty">
            Beauty
          </option>

          <option value="fragrances">
            Fragrances
          </option>

          <option value="furniture">
            Furniture
          </option>

          <option value="groceries">
            Groceries
          </option>

        </select>


        <select id="sort-select">

          <option value="default">
            Sort Products
          </option>

          <option value="low">
            Price: Low to High
          </option>

          <option value="high">
            Price: High to Low
          </option>

          <option value="name">
            Name: A to Z
          </option>

        </select>

      </div>


      <!-- PRODUCTS WILL LOAD HERE -->

      <div id="product-grid" class="product-grid">

        <p>
          Loading products...
        </p>

      </div>

    </section>


    <!-- ================= CART ================= -->

    <section id="cart" class="cart-section">

      <h2>
        Your Cart 🛒
      </h2>


      <div id="cart-items">

        <p>
          Your cart is empty.
        </p>

      </div>


      <div class="cart-summary">

        <h3>
          Total: ₹<span id="cart-total">0</span>
        </h3>

        <button id="checkout-btn">
          Checkout
        </button>

      </div>

    </section>

  </main>


  <!-- ================= LOGIN MODAL ================= -->

  <div
    id="login-modal"
    class="modal"
    style="display: none;"
  >

    <div class="modal-content">

      <button
        id="close-modal"
        class="close-btn"
      >
        ×
      </button>


      <h2>
        Login
      </h2>


      <input
        type="email"
        id="email"
        placeholder="Enter email"
      >


      <input
        type="password"
        id="password"
        placeholder="Enter password"
      >


      <button id="submit-login">
        Login
      </button>


      <p id="login-message"></p>

    </div>

  </div>


  <!-- IMPORTANT: defer added -->

  <script src="script.js" defer></script>

</body>

</html>
