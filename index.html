<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ShopEase - E-Commerce Store</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">

    <div class="logo">
      🛍️ ShopEase
    </div>

    <nav>
      <a href="#home">Home</a>
      <a href="#products">Products</a>
      <a href="#cart">Cart 🛒 <span id="cart-count">0</span></a>
      <button id="login-btn">Login</button>
    </nav>

  </header>


  <main>

    <!-- Hero Section -->

    <section id="home" class="hero">

      <div>
        <h1>Welcome to ShopEase</h1>

        <p>
          Discover amazing products at great prices.
        </p>

        <button onclick="scrollToProducts()">
          Shop Now
        </button>
      </div>

    </section>


    <!-- Products Section -->

    <section id="products" class="products-section">

      <h2>Our Products</h2>

      <div class="controls">

        <input
          type="search"
          id="search-input"
          placeholder="Search products..."
        >

        <select id="category-select">

          <option value="all">
            All Categories
          </option>

          <option value="beauty">
            Beauty
          </option>

          <option value="fragrances">
            Fragrances
          </option>

          <option value="furniture">
            Furniture
          </option>

          <option value="groceries">
            Groceries
          </option>

        </select>

        <select id="sort-select">

          <option value="default">
            Sort Products
          </option>

          <option value="low">
            Price: Low to High
          </option>

          <option value="high">
            Price: High to Low
          </option>

          <option value="name">
            Name: A to Z
          </option>

        </select>

      </div>
